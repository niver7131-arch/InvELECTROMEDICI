services:
  - type: web
    name: inventario-cns
    runtime: python
    repo: https://github.com/TU_USUARIO/TU_REPOSITORIO
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventario-cns-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: false
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app

databases:
  - name: inventario-cns-db
    plan: free